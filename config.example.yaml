# Copy to config.yaml and edit. Secrets (API keys, passwords, calendar links)
# go in .env — see .env.example. Anything you leave out uses a sensible default.

assistant:
  name: Vesper                  # what you call it; also the wake word (pick one people rarely say)
  wake_words: []                # the name and "hey <name>" always count; calibration adds
                                # the spellings Whisper hears for YOUR voice ("travis"…)
  user_name: J                  # how it addresses you
  # timezone: America/New_York  # only if the PC clock zone is wrong; the dashboard uses the PC zone
  work_hours: {start: "09:00", end: "18:00"}

# The whole point: everything gets ranked against this.
goals:
  north_star: "Grow the channel to full-time income while shipping client work on time"
  this_week:
    - Ship the PC assistant v1
    - Stream 4 nights (Mon/Wed/Fri/Sat)
    - Close out the two open client tickets

claude:
  model: claude-opus-5
  command_effort: low           # voice commands: fast
  briefing_effort: high         # morning plan: think harder

voice:
  enabled: true
  stt_engine: auto              # auto (= parakeet) | parakeet | moonshine | parakeet-large | whisper
                                # compare them on your voice: python -m assistant --bench-voice
                                # (--apply saves the winner to data/settings.yaml, which overrides this)
  # stt_model: base.en          # whisper engine only: tiny.en | base.en | small.en
  # stt_device: auto            # whisper engine only: cuda for an NVIDIA GPU
  endpoint_ms: 400              # pause that ends a command; raise it if you get cut off
  corrections: {}               # words it keeps mishearing, e.g. {vrb: BRB}
  push_to_talk_hotkey: ctrl+alt+j
  wake_mode: auto               # auto = acoustic once a trained vesper.onnx is added (Setup tab), else transcript
  # wake_threshold: 0.5         # trained models; per-model thresholds come from the Colab notebook
  # hard_triggers: {clip_that: "save the replay"}   # trained phrase -> command, run instantly
  barge_in: true                # say "stop" or the name to interrupt a reply
  follow_up_seconds: 8          # after a reply, talk again without the name
  # min_rms: 900                # speech loudness threshold; calibration measures your room
  speaker_check: strict         # after calibrating: strict = ignore other voices,
                                # log = score but never block, off = answer anyone
                                # (the Setup tab's switch overrides this)
  # Speaking voice. Easiest: pick one in the HUD (Setup → Speaking voice); that choice is
  # saved to data/settings.yaml and wins over this file.
  tts:
    engine: auto                # auto (= supertonic) | supertonic | kokoro | pyttsx3 (Windows SAPI) | browser | none
    voice: m1                   # supertonic: m1-m5, f1-f5 · kokoro: bm_george, bm_lewis, am_adam, bf_emma, …
    speed: 1.0
    stream: true                # speak Claude's reply sentence by sentence as it arrives
    # output_device: null       # speakers/headphones by index or name; default = Windows default
    # voice_hint: David         # pyttsx3 only: part of a SAPI voice name, e.g. "David", "Zira"

# Profiles drive activity tracking (which apps/sites count as what),
# "start <profile> mode" routines, and the Work / Stream dashboard views.
profiles:
  work:
    label: Work
    apps: [code, cursor, excel, winword, outlook, teams, slack, notion, windowsterminal, pycharm64]
    title_keywords: [github, jira, linear, docs.google, gmail, calendar, claude, stack overflow]
    launch:
      apps: [slack, vscode]
      urls: [gmail, calendar, "https://github.com/jwill736"]
    close_apps: [steam]
  stream:
    label: Stream
    apps: [obs64, obs, streamlabs, streamerbot, voicemod]
    title_keywords: [twitch.tv, dashboard.twitch, kick.com, youtube studio, streamlabs]
    launch:
      apps: [obs, discord, streamerbot]
      urls: ["https://dashboard.twitch.tv"]
      obs_scene: Starting Soon
    close_apps: [slack, teams]

# Spoken name -> how to launch it. The PC scan fills this in for you
# (config.discovered.yaml): ~40 common apps, every Steam/Epic game, and anything
# in the Start Menu opens by name. Only add entries here to fix or override one —
# an entry here fully replaces the scanned one.
apps: {}
#  vscode: {path: code, process: code}
#  obs:
#    path: C:\Program Files\obs-studio\bin\64bit\obs64.exe
#    cwd: C:\Program Files\obs-studio\bin\64bit   # OBS refuses to start from another folder
#    process: obs64

# "open gmail" / "open a new tab with twitch"
sites:
  gmail: https://mail.google.com
  calendar: https://calendar.google.com
  youtube: https://www.youtube.com
  twitch: https://www.twitch.tv
  twitch dashboard: https://dashboard.twitch.tv
  github: https://github.com
  claude: https://claude.ai
  chatgpt: https://chatgpt.com

# Any number of calendars, any provider, merged into one agenda.
# Put each private iCal link in .env and reference it with url_env.
calendars:
  - name: Work
    url_env: CAL_WORK_ICS
    profile: work
  - name: Personal
    url_env: CAL_PERSONAL_ICS
    profile: personal
  - name: Stream schedule
    url_env: CAL_STREAM_ICS
    profile: stream

news:
  refresh_minutes: 15
  feeds:
    - {name: Hacker News, url: "https://hnrss.org/frontpage?points=150", topic: tech}
    - {name: The Verge, url: "https://www.theverge.com/rss/index.xml", topic: tech}
    - {name: AI, url: "https://news.google.com/rss/search?q=Anthropic+OR+OpenAI+OR+%22AI+model%22&hl=en-US&gl=US&ceid=US:en", topic: ai}
    - {name: Streaming, url: "https://news.google.com/rss/search?q=Twitch+OR+%22YouTube+Live%22+streamers&hl=en-US&gl=US&ceid=US:en", topic: streaming}

projects:
  scan_dirs: ["~/Projects", "~/source/repos", "~/Documents/GitHub"]
  claude_dir: ~/.claude         # Claude Code sessions are read from here
  github:
    user: jwill736
    token_env: GITHUB_TOKEN     # optional; needed for private repos + PRs

obs:
  enabled: true
  host: localhost
  port: 4455
  password_env: OBS_PASSWORD
  scene_aliases:                # what you say -> exact scene name
    starting: Starting Soon
    be right back: BRB
    chatting: Just Chatting
    game: Gameplay

twitch:
  enabled: false
  channel: your_channel
  client_id_env: TWITCH_CLIENT_ID
  client_secret_env: TWITCH_CLIENT_SECRET

tracking:
  enabled: true
  sample_seconds: 5
  idle_seconds: 300             # no input for this long counts as idle

optimizer:
  heavy_process_mb: 1500
  protected_processes: [obs64, discord]   # never offered for closing

jobs:
  claude_code_cmd: claude
  permission_mode: acceptEdits  # what background Claude Code may do without asking
  max_concurrent: 2
  timeout_minutes: 30

tray:
  enabled: true                 # system tray icon (mute, push-to-talk, pause tracking, quit)

# Trigger phrases: say one phrase, run several actions in order.
# Steps: any tool (same names Claude uses), say: text, wait: seconds (max 30),
# command: "anything you'd say out loud". A macro with a risky step
# (closing apps, stopping the stream…) asks for one "yes" before it starts.
macros:
  brb:
    say: ["brb", "be right back", "taking a break"]
    steps:
      - obs_switch_scene: {scene: BRB}
      - obs_set_mute: {source: mic, muted: true}
      - say: "Be right back is up. Mic's muted."
  back:
    say: ["i'm back", "back from break"]
    steps:
      - obs_set_mute: {source: mic, muted: false}
      - obs_switch_scene: {scene: Gameplay}
      - say: "Welcome back. You're live on gameplay."
  wrap up stream:
    say: ["wrap it up", "end of stream", "wrap up the stream"]
    steps:
      - obs_switch_scene: {scene: Ending}
      - wait: 20
      - obs_control: {action: stop_stream} # risky → asks "yes?" before starting
  focus:
    say: ["focus mode", "lock in", "time to grind"]
    steps:
      - command: "start work mode"
      - set_power_plan: {plan: high}
      - say: "Locked in. Work apps are up and the PC is on high performance."
