name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the real target: the ctypes window/idle code, Start Menu
          # discovery and powercfg only execute here.
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -v -rs

  speech-models:
    # The default speech engine (Parakeet via sherpa-onnx), Silero VAD and the local
    # voices (Supertonic, Kokoro: spoken, then heard back) on real audio, on Windows:
    # guards against sherpa-onnx's reported empty-text bug there.
    name: speech models (windows-latest, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: tests/.models
          key: speech-models-${{ hashFiles('assistant/voice/models.py') }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt "sherpa-onnx>=1.13" "livekit-wakeword>=0.2"
      - name: Test
        env:
          ASSISTANT_MODEL_TESTS: "1"
        run: python -m pytest -v -rs tests/test_models_live.py

  local-llm:
    # The local brain against a real Llama: Ollama installs, pulls the model, and Vesper answers
    # a question, calls a tool, answers from memory and writes the morning plan with it.
    name: local Llama (Ollama, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # CPU inference is slow; a stuck call must fail, not run for GitHub's 6-hour default
    env:
      OLLAMA_MODEL: llama3.2:3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || (ollama serve > ollama.log 2>&1 &) ; sleep 3
          ollama pull "$OLLAMA_MODEL"
          ollama list
      - name: Test
        env:
          ASSISTANT_LLM_TESTS: "1"
        run: python -m pytest -v -rs -s tests/test_local_llm_live.py

  setup-script:
    # The beginner path exactly as the setup guide runs it: double-click setup.bat,
    # then check it built a working .venv with the voice packages and the config files.
    name: setup.bat (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pythons the launcher can see
        shell: cmd
        run: py -0p || echo no py launcher
      - name: Run setup.bat
        shell: cmd
        run: setup.bat < NUL
      - name: Check the result
        shell: cmd
        run: |
          .venv\Scripts\python -c "import sys, assistant, sherpa_onnx, sounddevice, pynput, livekit.wakeword; print(sys.version)" || exit /b 1
          if not exist config.yaml (echo config.yaml missing & exit /b 1)
          if not exist .env (echo .env missing & exit /b 1)
          .venv\Scripts\python -m assistant --help
      - uses: actions/cache@v4
        with:
          path: data/models
          key: runtime-models-${{ hashFiles('assistant/voice/models.py') }}
      - name: Boot it like start.bat and check the HUD answers
        # First launch on a bare PC: no mic, speakers, OBS or API keys. Everything that
        # can't connect must show up as a message, not take the app down.
        shell: cmd
        run: .venv\Scripts\python scripts\smoke_boot.py

  installer:
    # The one-line install a new user pastes, in Windows PowerShell 5.1 as they have it: Python 3.12 from
    # python.org (signature checked, per-user), Vesper from GitHub's zip of this commit, setup.bat, the
    # questions, shortcuts. Then the same again as an update (settings must survive), then the installed
    # copy boots the way its desktop shortcut starts it.
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install like the pasted line (fresh Python, code from GitHub)
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Vesper'
          & ([scriptblock]::Create((Get-Content .\install.ps1 -Raw))) -Dir $dir -Ref $env:REF -InstallPython -Unattended -NoStart -Name 'CI' -Goal 'Ship it by Friday' -BrainUrl 'http://127.0.0.1:9'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check what it made
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Vesper'
          $py = Join-Path $dir '.venv\Scripts\python.exe'
          & $py -c "import sys, sysconfig, assistant, sherpa_onnx, sounddevice, pynput, livekit.wakeword; print(sys.version, sysconfig.get_platform())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "from assistant.config import load_config; c = load_config(r'$dir\config.yaml'); print(c['assistant']['user_name'], c['goals']['north_star'], c['brain']['local']['url']); assert (c['assistant']['user_name'], c['goals']['north_star'], c['brain']['local']['url']) == ('CI', 'Ship it by Friday', 'http://127.0.0.1:9')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $programs = [Environment]::GetFolderPath('Programs')
          foreach ($f in "$dir\data\vesper.ico", "$([Environment]::GetFolderPath('Desktop'))\Vesper.lnk", "$programs\Vesper.lnk", "$programs\Update Vesper.lnk", "$dir\.env") {
            if (-not (Test-Path $f)) { Write-Host "missing: $f"; exit 1 }
          }
          if (-not ((Get-Content "$dir\setup.bat" -Raw) -match "`r`n")) { Write-Host 'setup.bat lost its CRLF line endings'; exit 1 }
      - name: Update over it (the same line again, as a file); settings kept
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Vesper'
          Add-Content "$dir\config.yaml" "`n# a note of my own"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Dir $dir -Ref $env:REF -Unattended -NoStart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path "$dir\config.yaml" -Pattern 'a note of my own' -Quiet)) { Write-Host 'the update replaced config.yaml'; exit 1 }
          & "$dir\.venv\Scripts\python.exe" -c "from assistant.config import load_config; assert load_config(r'$dir\config.yaml')['assistant']['user_name'] == 'CI'"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Vesper\data\models
          key: installer-models-${{ hashFiles('assistant/voice/models.py') }}
      - name: Boot the installed copy
        shell: cmd
        run: '"%RUNNER_TEMP%\Vesper\.venv\Scripts\python.exe" "%RUNNER_TEMP%\Vesper\scripts\smoke_boot.py"'
