name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the real target: the ctypes window/idle code, Start Menu
          # discovery and powercfg only execute here.
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -v -rs

  speech-models:
    # The default speech engine (Parakeet via sherpa-onnx) and Silero VAD on real
    # audio, on Windows: guards against sherpa-onnx's reported empty-text bug there.
    name: speech models (windows-latest, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: tests/.models
          key: speech-models-${{ hashFiles('assistant/voice/models.py') }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt "sherpa-onnx>=1.12" "livekit-wakeword>=0.2"
      - name: Test
        env:
          ASSISTANT_MODEL_TESTS: "1"
        run: python -m pytest -v -rs tests/test_models_live.py
